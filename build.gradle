plugins {
	id 'java'
	id 'org.springframework.boot' version '3.5.7'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.product'
version = '0.0.1-SNAPSHOT'
description = 'Demo project for Spring Boot'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(17)
	}
}

configurations {
	compileOnly {
		extendsFrom annotationProcessor
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-jdbc'
	implementation 'org.springframework.boot:spring-boot-starter-mail'
	implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'

	implementation 'org.springframework.boot:spring-boot-starter-oauth2-client'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.boot:spring-boot-starter-web'
	compileOnly 'org.projectlombok:lombok'
	annotationProcessor 'org.projectlombok:lombok'
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'org.springframework.security:spring-security-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

	implementation 'mysql:mysql-connector-java:8.0.33'

	implementation 'org.springframework.boot:spring-boot-starter-data-redis'

	implementation 'com.sun.mail:jakarta.mail:2.0.1'   // IMPORTANT for Boot 3.x

	// === RAZORPAY ===
	implementation 'com.razorpay:razorpay-java:1.3.7'
	implementation("org.springframework.boot:spring-boot-starter-webflux")
	implementation("org.springframework.boot:spring-boot-starter-web")

	// === CLOUDINARY ===
	implementation 'com.cloudinary:cloudinary-http44:1.34.0'

	// === XRPL (Ripple) ===
	//implementation 'org.xrpl:xrpl4j-client:3.3.1'
	//implementation 'org.xrpl:xrpl4j-core:3.3.1'
// For Gradle
	implementation 'org.xrpl:xrpl4j-client:5.1.0'
	implementation 'org.xrpl:xrpl4j-core:5.1.0'
// You may also need:
	implementation 'io.github.cdimascio:java-dotenv:5.2.2'

	implementation 'com.twilio.sdk:twilio:10.0.+'

	// === VAULT (Secrets) ===
	implementation 'org.springframework.vault:spring-vault-core:3.0.4'

// ---------- OAuth2 Client (Google) ----------
	implementation 'org.springframework.boot:spring-boot-starter-oauth2-client'

	// ---------- JWT (JJWT) ----------
	implementation 'io.jsonwebtoken:jjwt-api:0.11.5'
	runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.11.5'
	runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.11.5'


	// === JSON & HTTP ===
	implementation 'com.fasterxml.jackson.core:jackson-databind'
	implementation 'org.apache.httpcomponents.client5:httpclient5'

	implementation 'com.azure:azure-identity:1.12.0'
	implementation 'com.azure:azure-security-keyvault-secrets:4.7.0'

	implementation 'org.springframework.boot:spring-boot-starter-websocket'
	implementation 'com.google.api-client:google-api-client:2.6.0'
	implementation 'com.google.http-client:google-http-client-jackson2:1.43.3'

}

tasks.named('test') {
	useJUnitPlatform()
}

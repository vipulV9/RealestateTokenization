<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>New Property Listing Lead</title>
  <style>
    body { font-family: Arial, sans-serif; line-height: 1.6; color: #333; }
    .container { max-width: 600px; margin: 0 auto; padding: 20px; background: #f9f9f9; border-radius: 8px; }
    h2 { color: #1a5fb4; }
    .label { font-weight: bold; color: #2c3e50; }
    .value { margin-bottom: 15px; }
    .footer { margin-top: 30px; font-size: 12px; color: #7f8c8d; }
  </style>
</head>
<body>
<div class="container">
  <h2>New Property Owner Wants to List on BITSBRICK!</h2>
  <p>A potential property owner just submitted interest to tokenize their property.</p>

  <div class="value"><span class="label">Name:</span> <span th:text="${ownerName}"></span></div>
  <div class="value"><span class="label">Email:</span> <a th:href="'mailto:' + ${ownerEmail}" th:text="${ownerEmail}"></a></div>
  <div class="value"><span class="label">Phone:</span> <span th:text="${ownerPhone}"></span></div>
  <div class="value"><span class="label">City/Location:</span> <span th:text="${city}"></span></div>
  <div class="value"><span class="label">Property Type:</span> <span th:text="${propertyType}"></span></div>
  <div class="value"><span class="label">Approx Value:</span> <span th:text="${approxValue}"></span></div>
  <div class="value"><span class="label">Message:</span><br> <em th:text="${message}"></em></div>

  <div class="footer">
    <p>This lead was submitted via the "List Your Property" form on the website.</p>
    <p>Time: <span th:text="${#dates.format(#dates.createNow(), 'dd MMM yyyy, hh:mm a')}"></span></p>
  </div>
</div>
</body>
</html>

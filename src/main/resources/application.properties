spring.application.name=RealestateTokenization

# ==============================
# DATABASE (MySQL - Azure)
# ==============================
spring.datasource.url=jdbc:mysql://bitsbrick-db.mysql.database.azure.com:3306/bitsbrick_db?sslMode=REQUIRED
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false


# ==============================
# RAZORPAY
# ==============================
razorpay.key-id=${RAZORPAY_KEY_ID}
razorpay.key-secret=${RAZORPAY_KEY_SECRET}
razorpay.webhook.secret=${RAZORPAY_WEBHOOK_SECRET}
razorpay.payout-account-number=${RAZORPAY_PAYOUT_ACCOUNT}


# ==============================
# XRPL (TESTNET)
# ==============================
xrpl.network=testnet

# Cold Wallet (ISSUER)
xrpl.cold-wallet-seed=${XRPL_COLD_WALLET_SEED}
xrpl.cold-wallet-address=${XRPL_COLD_WALLET_ADDRESS}
xrpl.issuer-address=${XRPL_ISSUER_ADDRESS}

# Hot Wallet (DISTRIBUTOR)
xrpl.hot-wallet-seed=${XRPL_HOT_WALLET_SEED}
xrpl.hot-wallet-address=${XRPL_HOT_WALLET_ADDRESS}


# ==============================
# CLOUDINARY
# ==============================
cloudinary.cloud_name=${CLOUDINARY_CLOUD_NAME}
cloudinary.api_key=${CLOUDINARY_API_KEY}
cloudinary.api_secret=${CLOUDINARY_API_SECRET}


# ==============================
# ENCRYPTION
# ==============================
master.encryption.key=${MASTER_ENCRYPTION_KEY}


# ==============================
# GOOGLE OAUTH
# ==============================
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=openid,profile,email
spring.security.oauth2.client.registration.google.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}


# ==============================
# JWT
# ==============================
jwt.secret=${JWT_SECRET}
jwt.expiration=86400000


# ==============================
# REDIS
# ==============================
spring.data.redis.host=redis-17452.c16.us-east-1-2.ec2.cloud.redislabs.com
spring.data.redis.port=17452
spring.data.redis.username=default
spring.data.redis.password=pFw53aAGSnQGQyQLUtUiX39eZcl7io8P
spring.data.redis.ssl.enabled=false


# ==============================
# MAIL
# ==============================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true


